    <marker id="label-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#616767"/></marker>
  </defs>
  <rect width="1200" height="510" rx="12" fill="#fff"/>
  <rect x="140" y="58" width="1000" height="177" rx="27" fill="#f6f8fa" stroke="#b13b30" stroke-width="3" stroke-dasharray="12 9"/>
