<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">FMCW radar transmitter and receiver signal chain</title>
  <desc id="desc">A ramp waveform generator drives the local oscillator. Its signal feeds the power amplifier and transmit antenna, and a reference feeds the mixer. The receive antenna feeds the low-noise amplifier, then the mixer, intermediate-frequency stage, ADC, and digital signal processor.</desc>
