  <g fill="#f4f3ee" font-family="monospace" font-size="16" text-anchor="middle">
    <text x="117" y="291">Instruction</text>
    <text x="355" y="112">Control logic</text>
    <text x="355" y="280">Register file</text><text x="355" y="302" font-size="12">rs1 / rs2 → operands</text>
    <text x="355" y="482">Immediate gen.</text>
    <text x="647" y="252">32-bit ALU</text>
    <text x="647" y="389">Branch compare</text>
    <text x="920" y="241">Memory address</text><text x="920" y="263" font-size="12">ALU result</text>
    <text x="920" y="385">Data memory</text><text x="920" y="407" font-size="12">load / store data</text>
    <text x="647" y="537">Write-back mux</text>
