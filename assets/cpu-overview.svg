    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#d44422"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#a4aca0"/></marker>
  </defs>
  <rect width="1120" height="620" fill="#242622"/>
  <g fill="#30332d" stroke="#73796f" stroke-width="1.5">
    <rect x="42" y="250" width="150" height="72"/>
    <rect x="270" y="70" width="170" height="72"/>
    <rect x="270" y="240" width="170" height="92"/>
    <rect x="270" y="440" width="170" height="72"/>
    <rect x="560" y="205" width="175" height="82"/>
