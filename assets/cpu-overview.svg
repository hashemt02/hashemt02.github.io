<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">32-bit CPU datapath and control overview</title>
  <desc id="desc">Instruction fields drive control, register selection, and immediate generation. Register operands feed the ALU and branch comparator. The ALU computes memory addresses; register data supplies stores; loaded memory data and ALU results return through a write-back multiplexer to the register file.</desc>
