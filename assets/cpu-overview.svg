    <rect x="825" y="350" width="190" height="82"/>
    <rect x="560" y="500" width="175" height="62"/>
  </g>
  <g fill="none" stroke="#d44422" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M192 286H230V106H270"/>
    <path d="M192 286H270"/>
    <path d="M192 286H230V476H270"/>
    <path d="M440 262H500V230H560"/>
    <path d="M440 300H500V370H560"/>
    <path d="M440 476H500V262H560"/>
    <path d="M440 286H520V386H560"/>
    <path d="M735 246H825"/>
    <path d="M735 386H780V391H825"/>
    <path d="M440 316H780V415H825"/>
    <path d="M1015 376H1060V531H735"/>
    <path d="M735 246H770V531H735"/>
    <path d="M560 531H500V350H355V332"/>
  </g>
  <g fill="none" stroke="#a4aca0" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow-muted)">
    <path d="M355 142V205H560"/>
